<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sync Party</title>
<style>
  :root {
    --bg:#0f0f0f; --surface:#181818; --surface2:#212121; --accent:#ff3b5c;
    --text:#f1f1f1; --dim:#a0a0a0; --border:#2a2a2a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; }
  body {
    margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); overflow-x:hidden;
  }
  .screen {
    min-height:100vh; display:flex; flex-direction:column; padding:0;
    background: radial-gradient(circle at 20% 0%, #3a1030 0%, #0f0f0f 55%),
                radial-gradient(circle at 90% 10%, #1a2440 0%, transparent 45%),
                var(--bg);
    position:relative; overflow:hidden;
  }
  .card { background: transparent; border-radius:16px; padding:28px 24px; width:100%; max-width:420px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color: var(--dim); margin:0 0 24px; font-size:14px; }
  input, button {
    width:100%; padding:14px; border-radius:24px; border:none; font-size:16px; margin-bottom:12px;
    font-family:inherit;
  }
  input { background:#2a2a2a; color:var(--text); text-align:center; letter-spacing:2px; }
  input::placeholder { color:#777; }
  button { background: var(--accent); color:white; font-weight:600; cursor:pointer; border-radius:24px; }
  button.secondary { background:#2a2a2a; color:var(--text); }
  button:active { opacity:0.8; }
  .code-display { font-size:48px; text-align:center; letter-spacing:8px; font-weight:700; margin:20px 0; color:var(--accent); }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .hidden { display:none !important; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3ddc72; margin-right:6px; }
  .dot.bad { background:#e5533d; }

  /* ---------- Landing (modern hero) ---------- */
  .hero-top { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px 10px; text-align:center; position:relative; z-index:1; }
  .hero-logo {
    width:88px; height:88px; border-radius:24px; display:flex; align-items:center; justify-content:center;
    font-size:40px; background:linear-gradient(135deg, var(--accent), #7c3bff);
    box-shadow:0 12px 40px rgba(255,59,92,.35); margin-bottom:22px;
  }
  .hero-title { font-size:28px; font-weight:800; margin:0 0 8px; letter-spacing:-.5px; }
  .hero-sub { color:var(--dim); font-size:15px; margin:0; max-width:300px; line-height:1.4; }
  .hero-actions { position:relative; z-index:1; padding:20px 20px 40px; width:100%; max-width:420px; margin:0 auto; }
  .hero-strip { display:flex; gap:10px; overflow-x:auto; padding:4px 20px 22px; scrollbar-width:none; }
  .hero-strip::-webkit-scrollbar { display:none; }
  .hero-strip .mini-art { width:64px; height:64px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#2a2a2a; opacity:.9; }

  /* ---------- App shell (master/listener) ---------- */
  .app { display:none; flex-direction:column; min-height:100vh; padding-bottom:88px; }
  .app.active { display:flex; }
  .topbar {
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--border);
  }
  .topbar-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .brand { font-size:18px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .chip { background:var(--surface2); border-radius:14px; padding:4px 10px; font-size:12px; color:var(--dim); white-space:nowrap; }
  .chip.code { color:var(--accent); font-weight:700; letter-spacing:1px; }
  .search-wrap { position:relative; }
  .search-wrap input {
    text-align:left; letter-spacing:normal; background:var(--surface2);
    padding:12px 16px; margin-bottom:0; font-size:15px;
  }
  .adv-link { text-align:center; font-size:12px; color:var(--dim); margin-top:10px; cursor:pointer; text-decoration:underline; }
  .adv-panel { margin-top:10px; }
  .adv-panel input, .adv-panel button { margin-bottom:8px; }

  .content { flex:1; padding:8px 8px 16px; }
  .section-title { font-size:14px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; margin:14px 10px 6px; }
  .section-title.main { font-size:17px; color:var(--text); text-transform:none; letter-spacing:normal; margin:16px 10px 8px; }

  /* ---------- New releases carousel ---------- */
  .carousel { display:flex; gap:12px; overflow-x:auto; padding:4px 10px 10px; scroll-snap-type:x proximate; scrollbar-width:none; }
  .carousel::-webkit-scrollbar { display:none; }
  .carousel-card { flex:0 0 128px; scroll-snap-align:start; cursor:pointer; }
  .carousel-card img, .carousel-thumb-fallback {
    width:128px; height:128px; border-radius:10px; object-fit:cover; background:#2a2a2a; display:block; margin-bottom:6px;
  }
  .carousel-card .cc-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .carousel-card .cc-artist { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .carousel-card.playing .cc-title { color:var(--accent); }
  .carousel-skeleton { flex:0 0 128px; height:128px; border-radius:10px; }
  .track-row {
    display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:10px; cursor:pointer;
  }
  .track-row:active, .track-row.playing { background:var(--surface2); }
  .track-row img, .track-thumb-fallback {
    width:48px; height:48px; border-radius:6px; object-fit:cover; flex-shrink:0; background:#333;
  }
  .track-meta { flex:1; min-width:0; }
  .track-title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-row.playing .track-title { color: var(--accent); }
  .track-artist { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-dur { font-size:12px; color:var(--dim); flex-shrink:0; }
  .eq-bars { display:flex; align-items:flex-end; gap:2px; width:14px; height:14px; flex-shrink:0; }
  .eq-bars span { width:3px; background:var(--accent); animation: eq 0.9s ease-in-out infinite; }
  .eq-bars span:nth-child(1){height:40%;animation-delay:-0.6s;}
  .eq-bars span:nth-child(2){height:100%;animation-delay:-0.3s;}
  .eq-bars span:nth-child(3){height:60%;animation-delay:0s;}
  @keyframes eq { 0%,100%{transform:scaleY(.4);} 50%{transform:scaleY(1);} }
  .empty-msg { text-align:center; color:var(--dim); font-size:13px; padding:24px 0; }
  .skeleton { height:48px; border-radius:6px; background:linear-gradient(90deg,#222,#2b2b2b,#222); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  /* ---------- Now playing (listener big card) ---------- */
  .nowplaying-card { text-align:center; padding:10px 16px 4px; }
  .nowplaying-card img, .art-fallback {
    width:220px; height:220px; border-radius:14px; object-fit:cover; margin:10px auto 18px;
    display:block; background:#2a2a2a; box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .np-title { font-size:18px; font-weight:700; margin-bottom:4px; }
  .np-artist { font-size:14px; color:var(--dim); margin-bottom:16px; }
  .status-line { text-align:center; color:var(--dim); font-size:13px; margin-top:2px; }
  .volume-wrap { padding:6px 24px 0; }
  .volume-wrap label { font-size:12px; color:var(--dim); display:block; margin-bottom:6px; }

  /* ---------- Sticky bottom player ---------- */
  .player-bar {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:var(--surface); border-top:1px solid var(--border);
    display:none;
  }
  .player-bar.active { display:block; }
  .progress-track { width:100%; height:3px; background:#333; position:relative; cursor:pointer; }
  .progress-fill { position:absolute; left:0; top:0; height:100%; background:var(--accent); width:0%; }
  .player-main { display:flex; align-items:center; gap:12px; padding:10px 14px; }
  .player-main img, .player-thumb-fallback { width:44px; height:44px; border-radius:6px; object-fit:cover; background:#333; flex-shrink:0; }
  .player-meta { flex:1; min-width:0; }
  .player-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-artist { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .play-btn {
    width:40px; height:40px; border-radius:50%; background:var(--accent); color:white; border:none;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; cursor:pointer; margin:0;
  }
  .seek-panel { padding:0 16px 12px; display:none; }
  .seek-panel.open { display:block; }
  .seek-panel input[type=range] { padding:0; margin:6px 0 0; }
  .time-row { display:flex; justify-content:space-between; font-size:11px; color:var(--dim); }
</style>
</head>
<body>

<div class="screen" id="landingScreen">
  <div class="hero-top">
    <div class="hero-logo">🎵</div>
    <h1 class="hero-title">Sync Party</h1>
    <p class="hero-sub">Turn every phone in the room into one synced speaker.</p>
  </div>
  <div class="hero-strip" id="heroStrip"></div>
  <div class="hero-actions">
    <button id="createBtn">Create Room (Master)</button>
    <div class="row">
      <input id="joinCode" placeholder="ROOM CODE" maxlength="4" inputmode="numeric" />
      <button class="secondary" id="joinBtn" style="width:auto;flex:0 0 100px;">Join</button>
    </div>
  </div>
</div>

<!-- ---------- MASTER APP ---------- -->
<div class="app" id="masterView">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">🎵 Sync Party</div>
      <div class="row" style="flex:0 0 auto; gap:6px;">
        <span class="chip code">Room <span id="roomCodeM">----</span></span>
        <span class="chip" id="peerCountM">0 listeners</span>
      </div>
    </div>
    <div class="search-wrap">
      <input id="searchInput" placeholder="Search songs or artists" />
    </div>
    <div class="adv-link" id="advToggle">Paste a direct audio URL instead</div>
    <div class="adv-panel hidden" id="advPanel">
      <input id="trackUrl" placeholder="https://...song.mp3" style="text-align:left;letter-spacing:normal;" />
      <button class="secondary" id="loadBtn">Load &amp; Play URL</button>
    </div>
  </div>

  <div class="content">
    <div class="section-title main">New releases</div>
    <div class="carousel" id="newReleases"></div>
    <div class="section-title" id="listTitle">Trending</div>
    <div id="songList"></div>
  </div>
  <audio id="audioM" preload="auto" style="display:none;"></audio>
</div>

<!-- ---------- LISTENER APP ---------- -->
<div class="app" id="listenerView">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">🔊 Listening</div>
      <span class="chip" id="peerCountL"></span>
    </div>
  </div>
  <div class="content">
    <div class="nowplaying-card">
      <div id="npArtWrap"><div class="art-fallback"></div></div>
      <div class="np-title" id="npTitle">Waiting for the master to play something…</div>
      <div class="np-artist" id="npArtist"></div>
      <p class="status-line"><span class="dot" id="syncDot"></span><span id="syncStatus">Syncing clock…</span></p>
    </div>
    <div class="volume-wrap">
      <label>Volume</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
    </div>
  </div>
  <audio id="audioL" preload="auto" style="display:none;"></audio>
</div>

<!-- ---------- STICKY BOTTOM PLAYER (master only) ---------- -->
<div class="player-bar" id="playerBar">
  <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
  <div class="player-main" id="playerMain">
    <div id="playerArtWrap"><div class="player-thumb-fallback"></div></div>
    <div class="player-meta">
      <div class="player-title" id="playerTitle">Nothing playing</div>
      <div class="player-artist" id="playerArtist"></div>
    </div>
    <button class="play-btn" id="playPauseBtn">▶</button>
  </div>
  <div class="seek-panel" id="seekPanel">
    <input type="range" id="seekBar" min="0" max="1000" value="0" />
    <div class="time-row"><span id="seekCur">0:00</span><span id="seekDur">0:00</span></div>
  </div>
</div>

<script>
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const params = new URLSearchParams(location.search);
const serverHost = params.get('server') || location.host;
const ws = new WebSocket(`${proto}://${serverHost}`);

let clockOffset = 0;
let isMaster = false;
let audioEl = null;
let currentTrack = null; // {title, artist, artwork, url, duration}

const landingScreen = document.getElementById('landingScreen');
const masterView = document.getElementById('masterView');
const listenerView = document.getElementById('listenerView');
const playerBar = document.getElementById('playerBar');

function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

// ---------- Clock sync (NTP-style) ----------
function syncClock(samples = 5) {
  let best = null, count = 0;
  function pingOnce() {
    const t0 = Date.now();
    const handler = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type !== 'pong') return;
      const t1 = Date.now();
      const rtt = t1 - t0;
      const offset = msg.serverTime - (t0 + t1) / 2;
      if (best === null || rtt < best.rtt) best = { rtt, offset };
      ws.removeEventListener('message', handler);
      count++;
      if (count < samples) {
        setTimeout(pingOnce, 150);
      } else {
        clockOffset = best.offset;
        const s = document.getElementById('syncStatus');
        const d = document.getElementById('syncDot');
        if (s) s.textContent = 'Synced';
        if (d) d.classList.remove('bad');
      }
    };
    ws.addEventListener('message', handler);
    ws.send(JSON.stringify({ type: 'ping', t0 }));
  }
  pingOnce();
}
function serverNow() { return Date.now() + clockOffset; }
function localTimeFor(targetServerTime) { return targetServerTime - clockOffset; }
function scheduleAt(targetServerTime, fn) {
  const delay = Math.max(0, localTimeFor(targetServerTime) - Date.now());
  setTimeout(fn, delay);
}

// ---------- Landing actions ----------
document.getElementById('createBtn').onclick = () => {
  ws.send(JSON.stringify({ type: 'create' }));
};
document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('joinCode').value.trim();
  if (!code) return;
  audioEl = document.getElementById('audioL');
  audioEl.play().then(() => audioEl.pause()).catch(() => {});
  ws.send(JSON.stringify({ type: 'join', code }));
};

document.getElementById('advToggle').onclick = () => {
  document.getElementById('advPanel').classList.toggle('hidden');
};

// ---------- Audius browsing ----------
const AUDIUS_API = 'https://api.audius.co/v1';
const APP_NAME = 'SyncParty';
const songList = document.getElementById('songList');
const listTitle = document.getElementById('listTitle');

function artworkFor(t) {
  return (t.artwork && (t.artwork['480x480'] || t.artwork['150x150'])) || '';
}

function renderTracks(tracks) {
  songList.innerHTML = '';
  if (!tracks.length) {
    songList.innerHTML = '<div class="empty-msg">No results</div>';
    return;
  }
  tracks.forEach((t) => {
    const artwork = artworkFor(t);
    const streamUrl = `${AUDIUS_API}/tracks/${t.id}/stream?app_name=${APP_NAME}`;
    const row = document.createElement('div');
    row.className = 'track-row';
    row.dataset.url = streamUrl;
    row.innerHTML = `
      ${artwork ? `<img src="${artwork}" />` : '<div class="track-thumb-fallback"></div>'}
      <div class="track-meta">
        <div class="track-title">${t.title}</div>
        <div class="track-artist">${t.user ? t.user.name : ''}</div>
      </div>
      <div class="track-dur">${fmtTime(t.duration || 0)}</div>
    `;
    row.onclick = () => {
      loadTrack({
        url: streamUrl,
        title: t.title,
        artist: t.user ? t.user.name : '',
        artwork,
        duration: t.duration || 0,
      });
    };
    songList.appendChild(row);
  });
  highlightPlayingRow();
}

function highlightPlayingRow() {
  document.querySelectorAll('.track-row').forEach((row) => {
    const isPlaying = currentTrack && row.dataset.url === currentTrack.url;
    row.classList.toggle('playing', !!isPlaying);
    const durEl = row.querySelector('.track-dur');
    if (!durEl) return;
    if (isPlaying) {
      durEl.innerHTML = '<div class="eq-bars"><span></span><span></span><span></span></div>';
    } else if (durEl.querySelector('.eq-bars')) {
      // restore duration text (re-render list on next search anyway; safe fallback)
      durEl.textContent = '';
    }
  });
  document.querySelectorAll('.carousel-card').forEach((card) => {
    card.classList.toggle('playing', !!(currentTrack && card.dataset.url === currentTrack.url));
  });
}

function showSkeleton() {
  songList.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const sk = document.createElement('div');
    sk.className = 'skeleton';
    sk.style.marginBottom = '8px';
    songList.appendChild(sk);
  }
}

async function loadTrending() {
  listTitle.textContent = 'Trending';
  showSkeleton();
  try {
    const res = await fetch(`${AUDIUS_API}/tracks/trending?app_name=${APP_NAME}`);
    const json = await res.json();
    renderTracks((json.data || []).slice(0, 15));
  } catch (err) {
    songList.innerHTML = '<div class="empty-msg">Couldn\'t load trending — check connection</div>';
  }
}

// "New releases" carousel — Audius's freshest trending window (time=week)
// is the closest legitimate proxy for "latest songs" the public API exposes.
const newReleasesEl = document.getElementById('newReleases');
async function loadNewReleases() {
  if (!newReleasesEl) return;
  newReleasesEl.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const sk = document.createElement('div');
    sk.className = 'carousel-skeleton skeleton';
    newReleasesEl.appendChild(sk);
  }
  try {
    const res = await fetch(`${AUDIUS_API}/tracks/trending?time=week&app_name=${APP_NAME}`);
    const json = await res.json();
    const tracks = (json.data || []).slice(0, 10);
    newReleasesEl.innerHTML = '';
    tracks.forEach((t) => {
      const artwork = artworkFor(t);
      const streamUrl = `${AUDIUS_API}/tracks/${t.id}/stream?app_name=${APP_NAME}`;
      const card = document.createElement('div');
      card.className = 'carousel-card';
      card.dataset.url = streamUrl;
      card.innerHTML = `
        ${artwork ? `<img src="${artwork}" />` : '<div class="carousel-thumb-fallback"></div>'}
        <div class="cc-title">${t.title}</div>
        <div class="cc-artist">${t.user ? t.user.name : ''}</div>
      `;
      card.onclick = () => loadTrack({
        url: streamUrl, title: t.title, artist: t.user ? t.user.name : '', artwork, duration: t.duration || 0,
      });
      newReleasesEl.appendChild(card);
    });
  } catch (err) {
    newReleasesEl.innerHTML = '<div class="empty-msg">Couldn\'t load new releases</div>';
  }
}

// small preview strip of album art on the landing screen, purely decorative
async function loadHeroStrip() {
  const strip = document.getElementById('heroStrip');
  if (!strip) return;
  try {
    const res = await fetch(`${AUDIUS_API}/tracks/trending?app_name=${APP_NAME}`);
    const json = await res.json();
    const tracks = (json.data || []).slice(0, 10);
    strip.innerHTML = tracks
      .map((t) => artworkFor(t))
      .filter(Boolean)
      .map((art) => `<img class="mini-art" src="${art}" />`)
      .join('');
  } catch (err) { /* silent — purely decorative */ }
}
loadHeroStrip();

let searchDebounce = null;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if (!q) { loadTrending(); return; }
  searchDebounce = setTimeout(() => runSearch(q), 350);
});
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { clearTimeout(searchDebounce); runSearch(e.target.value.trim()); }
});

async function runSearch(query) {
  if (!query) return;
  listTitle.textContent = `Results for "${query}"`;
  showSkeleton();
  try {
    const res = await fetch(`${AUDIUS_API}/tracks/search?query=${encodeURIComponent(query)}&app_name=${APP_NAME}`);
    const json = await res.json();
    renderTracks((json.data || []).slice(0, 15));
  } catch (err) {
    songList.innerHTML = '<div class="empty-msg">Search failed — check connection</div>';
  }
}

// ---------- Master: load & control ----------
function loadTrack({ url, title, artist, artwork, duration }) {
  ws.send(JSON.stringify({ type: 'control', action: 'load', url, position: 0, title, artist, artwork, duration }));
}

document.getElementById('loadBtn').onclick = () => {
  const url = document.getElementById('trackUrl').value.trim();
  if (!url) return;
  loadTrack({ url, title: 'Direct URL track', artist: '', artwork: '', duration: 0 });
};

document.getElementById('playPauseBtn').onclick = () => {
  const audio = isMaster ? document.getElementById('audioM') : null;
  if (!audio) return;
  const btn = document.getElementById('playPauseBtn');
  if (audio.paused) {
    ws.send(JSON.stringify({ type: 'control', action: 'play', url: audio.src, position: audio.currentTime }));
    btn.textContent = '⏸';
  } else {
    ws.send(JSON.stringify({ type: 'control', action: 'pause', position: audio.currentTime }));
    btn.textContent = '▶';
  }
};

// expand/collapse seek panel on tap of player bar (master only)
document.getElementById('playerMain').addEventListener('click', (e) => {
  if (e.target.closest('.play-btn')) return;
  if (!isMaster) return;
  document.getElementById('seekPanel').classList.toggle('open');
});

let seekDragging = false;
const seekBarEl = document.getElementById('seekBar');
seekBarEl.addEventListener('input', () => { seekDragging = true; });
seekBarEl.addEventListener('change', (e) => {
  const audio = document.getElementById('audioM');
  const pos = (e.target.value / 1000) * (audio.duration || 0);
  ws.send(JSON.stringify({ type: 'control', action: 'seek', url: audio.src, position: pos }));
  seekDragging = false;
});

// tap-to-seek on the thin progress bar too
document.getElementById('progressTrack').addEventListener('click', (e) => {
  if (!isMaster) return;
  const audio = document.getElementById('audioM');
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  ws.send(JSON.stringify({ type: 'control', action: 'seek', url: audio.src, position: frac * audio.duration }));
});

let timeupdateTimer = null;
function startMasterHeartbeat() {
  const audio = document.getElementById('audioM');
  if (timeupdateTimer) clearInterval(timeupdateTimer);
  // tighter cadence (2s instead of 3s) keeps listeners locked in more closely
  timeupdateTimer = setInterval(() => {
    if (!audio.paused) {
      ws.send(JSON.stringify({ type: 'control', action: 'timeupdate', position: audio.currentTime }));
    }
  }, 2000);
}

document.getElementById('volume').oninput = (e) => {
  if (audioEl) audioEl.volume = parseFloat(e.target.value);
};

// ---------- Shared UI updates ----------
function setNowPlayingUI(track) {
  currentTrack = track;
  const artwork = track.artwork;

  // bottom bar (master)
  document.getElementById('playerTitle').textContent = track.title || 'Untitled';
  document.getElementById('playerArtist').textContent = track.artist || '';
  document.getElementById('playerArtWrap').innerHTML = artwork
    ? `<img src="${artwork}" />` : '<div class="player-thumb-fallback"></div>';
  playerBar.classList.add('active');
  document.getElementById('seekDur').textContent = fmtTime(track.duration || 0);

  // big now-playing card (listener)
  document.getElementById('npTitle').textContent = track.title || 'Untitled';
  document.getElementById('npArtist').textContent = track.artist || '';
  document.getElementById('npArtWrap').innerHTML = artwork
    ? `<img src="${artwork}" />` : '<div class="art-fallback"></div>';

  highlightPlayingRow();
}

// ---------- Incoming messages ----------
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);

  switch (msg.type) {
    case 'created': {
      isMaster = true;
      landingScreen.classList.add('hidden');
      masterView.classList.add('active');
      document.getElementById('roomCodeM').textContent = msg.code;
      audioEl = document.getElementById('audioM');
      syncClock();
      startMasterHeartbeat();
      loadNewReleases();
      loadTrending();
      audioEl.addEventListener('timeupdate', () => {
        if (audioEl.duration && !seekDragging) {
          seekBarEl.value = (audioEl.currentTime / audioEl.duration) * 1000;
          document.getElementById('progressFill').style.width = `${(audioEl.currentTime / audioEl.duration) * 100}%`;
          document.getElementById('seekCur').textContent = fmtTime(audioEl.currentTime);
        }
      });
      break;
    }

    case 'joined': {
      landingScreen.classList.add('hidden');
      listenerView.classList.add('active');
      syncClock();
      break;
    }

    case 'error': {
      alert(msg.message);
      break;
    }

    case 'peers': {
      const text = `${msg.count} device${msg.count === 1 ? '' : 's'}`;
      const m = document.getElementById('peerCountM');
      const l = document.getElementById('peerCountL');
      if (m) m.textContent = `${text} connected`;
      if (l) l.textContent = `${text} connected`;
      break;
    }

    case 'masterLeft': {
      alert('Master left — room closed.');
      location.reload();
      break;
    }

    case 'control': {
      const audio = isMaster ? document.getElementById('audioM') : document.getElementById('audioL');
      if (!audio) break;

      if (msg.action === 'load') {
        setNowPlayingUI({ title: msg.title, artist: msg.artist, artwork: msg.artwork, duration: msg.duration, url: msg.url });
        audio.src = msg.url;
        audio.load();

        const startPlaying = () => {
          audio.currentTime = msg.position || 0;
          scheduleAt(msg.targetServerTime, () => audio.play().catch(() => {}));
        };
        // 'canplay' fires much sooner than 'canplaythrough' (no need to wait for
        // a full-buffer estimate), and we fall back to starting anyway after a
        // short timeout so a slow network never leaves playback hanging.
        let started = false;
        const onCanPlay = () => { if (!started) { started = true; startPlaying(); } };
        audio.addEventListener('canplay', onCanPlay, { once: true });
        setTimeout(() => { if (!started) { started = true; startPlaying(); } }, 2500);

        if (isMaster) {
          document.getElementById('playPauseBtn').textContent = '⏸';
        }
      }

      if (msg.action === 'play') {
        audio.currentTime = msg.position || 0;
        scheduleAt(msg.targetServerTime, () => audio.play().catch(() => {}));
        if (isMaster) document.getElementById('playPauseBtn').textContent = '⏸';
      }

      if (msg.action === 'pause') {
        scheduleAt(msg.targetServerTime, () => audio.pause());
        if (isMaster) document.getElementById('playPauseBtn').textContent = '▶';
      }

      if (msg.action === 'seek') {
        scheduleAt(msg.targetServerTime, () => { audio.currentTime = msg.position; });
      }

      if (msg.action === 'timeupdate' && !isMaster) {
        // drift correction for listeners — gentler thresholds & smaller
        // playbackRate nudges so corrections aren't audible as stutter
        const elapsed = (Date.now() - localTimeFor(msg.serverTime)) / 1000;
        const expected = msg.position + elapsed;
        const drift = expected - audio.currentTime;
        const dot = document.getElementById('syncDot');
        const label = document.getElementById('syncStatus');
        if (Math.abs(drift) > 0.45) {
          audio.currentTime = expected;
          audio.playbackRate = 1;
          if (dot) dot.classList.add('bad');
        } else {
          if (dot) dot.classList.remove('bad');
          audio.playbackRate = drift > 0.08 ? 1.015 : drift < -0.08 ? 0.985 : 1;
        }
        if (label) label.textContent = `Synced (drift ${Math.round(drift * 1000)}ms)`;
      }
      break;
    }
  }
};
</script>
